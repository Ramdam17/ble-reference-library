# BLE Reference Library — Sprint Tracker
# Machine-readable sprint status for AI agents and CI tooling.
#
# STATUS VALUES:
#   not_started   — sprint not yet begun
#   in_progress   — branch created, work ongoing
#   in_review     — PR open, awaiting review
#   blocked       — waiting on dependency or external factor
#   done          — merged to develop, all acceptance criteria met
#
# AGENT INSTRUCTIONS:
#   - Before starting a sprint, set status to `in_progress` and record `started_at`.
#   - Before opening a PR, verify all `acceptance_criteria` are checked.
#   - After merge, set status to `done` and record `completed_at`.
#   - Never start a sprint whose `depends_on` sprints are not `done`.

